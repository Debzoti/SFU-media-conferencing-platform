version: '3.8'

services:
  app:
    build: .
    container_name: mediasoup-hls-stream
    ports:
      - "5400:5400"
      - "10000-10100:10000-10100/udp"
      - "10000-10100:10000-10100/tcp"
    environment:
      - NODE_ENV=production
      - PORT=5400
      - SERVER_URL=http://localhost:5400
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for development (optional, remove for production)
      - ./src:/app/src:Z
      - ./public:/app/public:Z
      - ./client:/app/client:Z
    restart: unless-stopped
