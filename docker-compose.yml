version: '3.8'

services:
  app:
    build: .
    container_name: mediasoup-hls-stream
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVER_URL=http://localhost:3000
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for development (optional, remove for production)
      - ./src:/app/src:Z
      - ./public:/app/public:Z
      - ./client:/app/client:Z
    restart: unless-stopped
